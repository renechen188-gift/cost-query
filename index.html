<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>麻媽家．涼三伯｜成本查詢暨定價系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --surface2: #f0f0f0;
    --border: #e0e0e0;
    --accent: #c97a1e;
    --accent2: #a85f0f;
    --text: #1a1a1a;
    --text2: #666;
    --text3: #999;
    --green: #2e7d56;
    --red: #c0392b;
    --yellow: #b8860b;
    --tag-bg: #fff3e0;
  }


  /* Login Screen */
  .login-screen {
    position: fixed;
    inset: 0;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 24px;
  }
  .login-box {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 20px;
    font-weight: 700;
    color: #c97a1e;
  }
  .login-sub {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 28px;
  }
  .login-label {
    font-size: 12px;
    font-weight: 600;
    color: #666;
    margin-bottom: 6px;
    display: block;
  }
  .login-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    color: #1a1a1a;
    background: #fafafa;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-input:focus { border-color: #c97a1e; background: #fff; }
  .login-btn {
    width: 100%;
    padding: 13px;
    background: #c97a1e;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s;
  }
  .login-btn:active { background: #a85f0f; }
  .login-error {
    color: #c0392b;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
  }
  .app-hidden { display: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 960px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .logo {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--text2); font-weight: 300; font-size: 13px; margin-left: 6px; }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
  }
  input[type="search"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px 10px 38px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--text3); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
  }
  .tab {
    flex: 1;
    padding: 7px 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    text-align: center;
    font-family: inherit;
    transition: all 0.15s;
    user-select: none;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f0f0f;
    font-weight: 700;
  }

  /* Store filter */
  .store-filter {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .store-filter::-webkit-scrollbar { display: none; }
  .store-btn {
    flex-shrink: 0;
    padding: 5px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .store-btn.active {
    background: var(--tag-bg);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Count bar */
  .count-bar {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
  }

  /* List */
  .list { padding: 0 0 80px; }

  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 10px;
    cursor: pointer;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .group-header:active { opacity: 0.7; }
  .group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
  }
  .group-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-count {
    font-size: 12px;
    color: var(--text3);
  }
  .group-chevron {
    font-size: 11px;
    color: var(--text3);
    transition: transform 0.2s;
  }
  .group-chevron.collapsed { transform: rotate(-90deg); }
  .group-items { }
  .group-items.collapsed { display: none; }

  .item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    gap: 10px;
    active: background: var(--surface);
  }
  .item:active { background: var(--surface); }

  .item-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .item-dot.prod { background: var(--accent); }
  .item-dot.mat  { background: var(--green); }
  .item-dot.semi { background: #7b68ee; }
  .item-dot.pkg  { background: #e05757; }

  .item-main { flex: 1; min-width: 0; }
  .item-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .item-sub {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .item-tag {
    background: var(--surface2);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    color: var(--text3);
  }

  .item-right { text-align: right; flex-shrink: 0; }
  .item-cost {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .item-cost-label { font-size: 10px; color: var(--text3); }
  .cost-pct {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 3px;
    display: inline-block;
  }
  .pct-good { background: #e8f5ee; color: var(--green); }
  .pct-mid { background: #fef9e7; color: var(--yellow); }
  .pct-bad { background: #fdecea; color: var(--red); }

  /* Detail Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .modal-overlay.show .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .modal-tag {
    background: var(--surface2);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
    color: var(--text2);
  }
  .modal-body { padding: 16px 20px; }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface2);
    border-radius: 10px;
    padding: 12px;
    border: 1px solid var(--border);
  }
  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value small { font-size: 13px; font-weight: 400; color: var(--text2); }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .spec-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .spec-row:last-child { border-bottom: none; }
  .spec-label { color: var(--text2); }
  .spec-value { color: var(--text); font-weight: 500; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  /* Pricing Panel */
  .pr { padding: 12px 16px 80px; }
  .pr .sec { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--border); }
  .pr .sec-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
  .pr .fld { margin-bottom: 10px; }
  .pr .fld:last-child { margin-bottom: 0; }
  .pr .fld-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .pr .fld-hint { font-size: 10px; color: var(--text3); }
  .pr .fld-row { display: flex; gap: 8px; align-items: center; }
  .pr .fld-row input, .pr .fld-row select { flex: 1; }
  .pr input[type=number], .pr select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: var(--surface2); -webkit-appearance: none;
  }
  .pr input:focus, .pr select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .pr .unit { font-size: 13px; color: var(--text2); white-space: nowrap; min-width: 20px; }
  .pr .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pr .chip {
    padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; background: var(--surface); color: var(--text2); font-family: inherit;
  }
  .pr .chip:active { opacity: 0.7; }
  .pr .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pr .tog-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .pr .tog-label { font-size: 13px; flex: 1; }
  .pr .tog { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .pr .tog input { opacity: 0; width: 0; height: 0; }
  .pr .tog .sl { position: absolute; inset: 0; background: #ddd; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  .pr .tog .sl:before { content:''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  .pr .tog input:checked + .sl { background: var(--accent); }
  .pr .tog input:checked + .sl:before { transform: translateX(20px); }
  .pr .res { background: linear-gradient(135deg, #fff7ed, #fff); border: 2px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .pr .res-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 10px; text-align: center; }
  .pr .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pr .res-item { text-align: center; padding: 8px; border-radius: 8px; background: rgba(201,122,30,0.06); }
  .pr .res-item .rl { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
  .pr .res-item .rv { font-size: 20px; font-weight: 700; }
  .pr .res-item .rs { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .pr .bk-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
  .pr .bk-row:last-child { border-bottom: none; }
  .pr .bk-row.tot { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; padding-top: 8px; margin-top: 4px; }
  .pr .bk-row .bl { color: var(--text2); }
  .pr .bk-row .bv { font-weight: 600; }
  .pr .cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pr .cmp-item { text-align: center; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border); }
  .pr .cmp-item .cl { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
  .pr .cmp-item .cv { font-size: 16px; font-weight: 700; }
  .c-green { color: var(--green); }
  .c-red { color: var(--red); }
  .c-yellow { color: var(--yellow); }
  .c-neutral { color: var(--text); }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">麻媽家．涼三伯</div>
    <div class="login-sub">成本查詢暨定價系統</div>
    <label class="login-label">帳號</label>
    <input class="login-input" id="loginUser" type="text" placeholder="請輸入帳號" autocomplete="username">
    <label class="login-label">密碼</label>
    <input class="login-input" id="loginPass" type="password" placeholder="請輸入密碼" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">登入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot" class="app-hidden">
<div class="header">
  <div class="header-top">
    <div class="logo">麻媽家．涼三伯 <span>成本查詢暨定價系統</span></div>
    <div id="updateDate" style="font-size:11px;color:var(--text3)"></div>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="searchInput" placeholder="關鍵字搜尋…" autocomplete="off">
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="products">產品 <span id="prodCount"></span></button>
    <button class="tab" data-tab="materials">食材 <span id="matCount"></span></button>
    <button class="tab" data-tab="packaging">包材 <span id="pkgCount"></span></button>
    <button class="tab" data-tab="semis">半成品 <span id="semiCount"></span></button>
    <button class="tab" data-tab="pricing">🧮 定價</button>
  </div>
</div>

<div class="store-filter" id="storeFilter"></div>
<div class="count-bar" id="countBar"></div>
<div class="list" id="listContainer"></div>
<div id="pricingPanel" style="display:none"></div>

</div><!-- /appRoot -->

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://sjvnnpqhrlahgnbibvuv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqdm5ucHFocmxhaGduYmlidnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDY5ODQsImV4cCI6MjA5MjA4Mjk4NH0.HqTV0y3CqmrlqGlDzw-Xrg8EiIdJm7Y81XvhlLkVqDc';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let MATERIALS = [], PACKAGING = [], SEMIS = [], PRODUCTS = [];

async function loadData() {
  const [m, p, s, pr] = await Promise.all([
    db.from('cost_materials').select('*').order('id'),
    db.from('cost_packaging').select('*').order('id'),
    db.from('cost_semis').select('*').order('name'),
    db.from('cost_products').select('*').order('category').order('name'),
  ]);
  MATERIALS = (m.data || []).map(r => ({...r, price: Number(r.price), unit_cost: Number(r.unit_cost)}));
  PACKAGING = (p.data || []).map(r => ({...r, price: Number(r.price), unit_cost: Number(r.unit_cost), qty: Number(r.qty)}));
  SEMIS = (s.data || []).map(r => ({...r, total_cost: Number(r.total_cost), yield_g: Number(r.yield_g), unit_cost: Number(r.unit_cost)}));
  PRODUCTS = (pr.data || []).map(r => ({...r, price: Number(r.price), cost: Number(r.cost), cost_pct: Number(r.cost_pct)}));
  document.getElementById('prodCount').textContent = PRODUCTS.length;
  document.getElementById('matCount').textContent = MATERIALS.length;
  document.getElementById('pkgCount').textContent = PACKAGING.length;
  document.getElementById('semiCount').textContent = SEMIS.length;
}

const ICONS = { mat: '🥬', semi: '🍲', prod: '🍱', pkg: '📦' };
const STORE_COLORS = { '麻媽家': '#c97a1e', '涼三伯': '#2e7d56', 'ALL': '#999' };

let currentTab = 'products';
let currentStore = 'ALL';
let searchQuery = '';

function getPctClass(pct) {
  if (pct <= 30) return 'pct-good';
  if (pct <= 40) return 'pct-mid';
  return 'pct-bad';
}

function formatCost(v) {
  if (v >= 1) return v.toFixed(2);
  if (v >= 0.01) return v.toFixed(4);
  return v.toFixed(6);
}

function getFilters() {
  if (currentTab === 'products') {
    const cats = [...new Set(PRODUCTS.map(p => p.category))];
    return ['ALL', ...cats];
  }
  if (currentTab === 'materials') {
    const cats = [...new Set(MATERIALS.map(m => m.category))];
    return ['ALL', ...cats];
  }
  if (currentTab === 'packaging') {
    const stores = [...new Set(PACKAGING.map(p => p.store))];
    return ['ALL', ...stores.filter(s => s !== 'ALL')];
  }
  return ['ALL'];
}

function filterData() {
  const q = searchQuery.toLowerCase();
  if (currentTab === 'products') {
    return PRODUCTS.filter(p => {
      const matchCat = currentStore === 'ALL' || p.category === currentStore;
      const matchQ = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      return matchCat && matchQ;
    });
  }
  if (currentTab === 'materials') {
    return MATERIALS.filter(m => {
      const matchCat = currentStore === 'ALL' || m.category === currentStore;
      const matchQ = !q || m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q) || m.id.toLowerCase().includes(q);
      return matchCat && matchQ;
    });
  }
  if (currentTab === 'packaging') {
    return PACKAGING.filter(p => {
      const matchStore = currentStore === 'ALL' || p.store === currentStore || p.store === 'ALL';
      const matchQ = !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || p.spec.toLowerCase().includes(q);
      return matchStore && matchQ;
    });
  }
  if (currentTab === 'semis') {
    return SEMIS.filter(s => {
      const matchQ = !q || s.name.toLowerCase().includes(q);
      return matchQ;
    });
  }
  return [];
}

function groupBy(arr, key) {
  const groups = {};
  arr.forEach(item => {
    const k = item[key] || '其他';
    if (!groups[k]) groups[k] = [];
    groups[k].push(item);
  });
  return groups;
}

function renderStoreFilter() {
  const sf = document.getElementById('storeFilter');
  const filters = getFilters();
  sf.innerHTML = filters.map(s => `
    <button class="store-btn ${currentStore === s ? 'active' : ''}" onclick="setStore('${s}')">
      ${s === 'ALL' ? '全部' : s}

}

function setStore(s) {
  currentStore = s;
  renderStoreFilter();
  renderList();
}

function renderList() {
  const data = filterData();
  const container = document.getElementById('listContainer');
  document.getElementById('countBar').textContent = `顯示 ${data.length} 筆`;

  if (data.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">找不到相關項目</div></div>`;
    return;
  }

  let html = '';

  const collapsed = window._collapsed || {};
  window._collapsed = collapsed;

  function makeGroup(catKey, catLabel, dotClass, itemsHtml, count) {
    const isOpen = collapsed[catKey] !== true;
    return `<div>
      <div class="group-header" onclick="toggleGroup('${catKey}')">
        <span class="group-title">${catLabel}</span>
        <span class="group-meta">
          <span class="group-count">${count} 項</span>
          <span class="group-chevron${isOpen ? '' : ' collapsed'}">▼</span>
        </span>
      </div>
      <div class="group-items${isOpen ? '' : ' collapsed'}" id="grp-${catKey}">${itemsHtml}</div>
    </div>`;
  }

  if (currentTab === 'products') {
    const groups = groupBy(data, 'category');
    for (const [cat, items] of Object.entries(groups)) {
      let inner = '';
      items.forEach(p => {
        inner += `<div class="item" onclick="showProduct(${PRODUCTS.indexOf(p)})">
          <div class="item-dot prod"></div>
          <div class="item-main">
            <div class="item-name">${p.name}</div>
            <div class="item-sub">
              <span class="item-tag" style="color:${STORE_COLORS[p.store]||'#999'}">${p.store}</span>
              <span>售價 $${p.price}</span>
            </div>
          </div>
          <div class="item-right">
            <div class="item-cost">$${p.cost}</div>
            <div class="cost-pct ${getPctClass(p.cost_pct)}">${p.cost_pct}%</div>
          </div>
        </div>`;
      });
      html += makeGroup('prod_'+cat, cat, 'prod', inner, items.length);
    }
  } else if (currentTab === 'materials') {
    const groups = groupBy(data, 'category');
    for (const [cat, items] of Object.entries(groups)) {
      let inner = '';
      items.forEach(m => {
        const idx = MATERIALS.findIndex(x => x.id === m.id);
        inner += `<div class="item" onclick="showMaterial(${idx})">
          <div class="item-dot mat"></div>
          <div class="item-main">
            <div class="item-name">${m.name}</div>
            <div class="item-sub">
              <span class="item-tag">${m.id}</span>
              <span>${m.spec}</span>
            </div>
          </div>
          <div class="item-right">
            <div class="item-cost">${formatCost(m.unit_cost)}</div>
            <div class="item-cost-label">元/${m.unit}</div>
          </div>
        </div>`;
      });
      html += makeGroup('mat_'+cat, cat, 'mat', inner, items.length);
    }
  } else if (currentTab === 'packaging') {
    let inner = '';
    data.forEach(p => {
      const idx = PACKAGING.findIndex(x => x.id === p.id);
      inner += `<div class="item" onclick="showPackaging(${idx})">
        <div class="item-dot pkg"></div>
        <div class="item-main">
          <div class="item-name">${p.name}</div>
          <div class="item-sub">
            <span class="item-tag">${p.id}</span>
            <span>${p.spec}</span>
          </div>
        </div>
        <div class="item-right">
          <div class="item-cost">${formatCost(p.unit_cost)}</div>
          <div class="item-cost-label">元/個</div>
        </div>
      </div>`;
    });
    html += makeGroup('pkg_all', '包材', 'pkg', inner, data.length);
  } else {
    let inner = '';
    data.forEach(s => {
      const idx = SEMIS.findIndex(x => x.name === s.name);
      inner += `<div class="item" onclick="showSemi(${idx})">
        <div class="item-dot semi"></div>
        <div class="item-main">
          <div class="item-name">${s.name}</div>
          <div class="item-sub">
            <span>產出 ${s.yield_g >= 1000 ? (s.yield_g/1000).toFixed(1)+'kg' : s.yield_g+'g'}</span>
            ${s.note ? `<span class="item-tag">${s.note.substring(0,8)}</span>` : ''}
          </div>
        </div>
        <div class="item-right">
          <div class="item-cost">${formatCost(s.unit_cost)}</div>
          <div class="item-cost-label">元/g</div>
        </div>
      </div>`;
    });
    html += makeGroup('semi_all', '半成品', 'semi', inner, data.length);
  }

  container.innerHTML = html;
}

function toggleGroup(key) {
  const w = window._collapsed || {};
  w[key] = !w[key];
  window._collapsed = w;
  // toggle DOM directly without full re-render
  const grp = document.getElementById('grp-' + key);
  const header = grp ? grp.previousElementSibling : null;
  if (grp) grp.classList.toggle('collapsed', w[key]);
  if (header) {
    const chev = header.querySelector('.group-chevron');
    if (chev) chev.classList.toggle('collapsed', w[key]);
  }
}

function isAdmin() { return sessionStorage.getItem('cq_auth') === 'rene'; }

function adminBtns(type, idx) {
  if (!isAdmin()) return '';
  return `<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">

      {k:'name',l:'名稱',v:item.name},
      {k:'total_cost',l:'總材料成本',v:item.total_cost,t:'number'},
      {k:'yield_g',l:'產出量(g)',v:item.yield_g,t:'number'},
      {k:'unit_cost',l:'單位成本(每g)',v:item.unit_cost,t:'number'},
      {k:'note',l:'備註',v:item.note||''},
    ];
  } else {
    item = PACKAGING[idx]; title = '編輯包材';
    fields = [
      {k:'id',l:'編號',v:item.id,ro:true},
      {k:'name',l:'名稱',v:item.name},
      {k:'spec',l:'規格',v:item.spec},
      {k:'price',l:'進貨單價',v:item.price,t:'number'},

      <label style="display:block;font-size:12px;color:#888;margin-bottom:2px">${f.l}</label>

        <button onclick="closeModal()" style="padding:8px 20px;border-radius:8px;border:1px solid #555;color:#aaa;background:transparent;cursor:pointer">取消</button>

      </div>
    </div>`;

async function saveItem(type, idx) {
  const get = k => document.getElementById('ef_'+k)?.value;
  let table, data, match;
  if (type === 'product') {
    table = 'cost_products';
    const item = PRODUCTS[idx];
    const price = Number(get('price'));
    const cost = Number(get('cost')) || item.cost;
    const costPct = price > 0 ? Math.round(cost / price * 1000) / 10 : 0;
    data = {name:get('name'),category:get('category'),store:get('store'),price,cost,cost_pct:costPct};
    match = {id: item.id};
  } else if (type === 'material') {
    table = 'cost_materials';
    data = {name:get('name'),spec:get('spec'),price:Number(get('price')),unit_cost:Number(get('unit_cost')),unit:get('unit'),category:get('category'),store:get('store')};
    match = {id: get('id')};
  } else if (type === 'semi') {
    table = 'cost_semis';
    const item = SEMIS[idx];
    data = {name:get('name'),total_cost:Number(get('total_cost')),yield_g:Number(get('yield_g')),unit_cost:Number(get('unit_cost')),note:get('note')||null};
    match = {id: item.id};
  } else {
    table = 'cost_packaging';
    data = {name:get('name'),spec:get('spec'),price:Number(get('price')),qty:Number(get('qty')),unit_cost:Number(get('unit_cost')),store:get('store')};
    match = {id: get('id')};
  }
  const {error} = await db.from(table).update(data).eq('id', match.id);
  if (error) { alert('儲存失敗: ' + error.message); return; }
  await loadData();
  closeModal();
  renderList();
}

async function deleteItem(type, idx) {
  if (!confirm('確定刪除此筆資料？')) return;
  let table, id;
  if (type === 'product') { table = 'cost_products'; id = PRODUCTS[idx].id; }
  else if (type === 'material') { table = 'cost_materials'; id = MATERIALS[idx].id; }
  else if (type === 'semi') { table = 'cost_semis'; id = SEMIS[idx].id; }
  else { table = 'cost_packaging'; id = PACKAGING[idx].id; }
  const {error} = await db.from(table).delete().eq('id', id);
  if (error) { alert('刪除失敗: ' + error.message); return; }
  await loadData();
  closeModal();
  renderList();
}

        <td style="padding:5px 8px">${b.ingredient}</td>

async function delBomRow(id, table) {
  if (!confirm('確定刪除此配料？')) return;
  const t = table === 'semi' ? 'cost_semi_bom' : 'cost_bom';
  const {error} = await db.from(t).delete().eq('id', id);
  if (error) { alert('刪除失敗: ' + error.message); return; }
  if (table === 'semi' && _showSemiIdx !== null) {
    const semiName = SEMIS[_showSemiIdx].name;
    await recalcSemi(semiName);
    await loadData();
    _showSemiIdx = SEMIS.findIndex(s => s.name === semiName);
    showSemi(_showSemiIdx);
  } else if (_showProductIdx !== null) {
    const prodName = PRODUCTS[_showProductIdx].name;
    await recalcProduct(prodName);
    await loadData();
    _showProductIdx = PRODUCTS.findIndex(p => p.name === prodName);
    showProduct(_showProductIdx);
  }
}

async function addBomRow(productName) {
  const ingredient = prompt('配料名稱：');
  if (!ingredient) return;
  const qty = parseFloat(prompt('用量（g 或個數）：'));
  if (!qty || isNaN(qty)) return;
  const unit = prompt('單位（g/個/份/包）：', 'g') || 'g';
  const cost = parseFloat(prompt('成本（元）：'));
  if (!cost || isNaN(cost)) return;
  const {error} = await db.from('cost_bom').insert({product: productName, ingredient, qty, unit, cost, type: 'material'});
  if (error) { alert('新增失敗: ' + error.message); return; }
  await recalcProduct(productName);
  await loadData();
  _showProductIdx = PRODUCTS.findIndex(p => p.name === productName);
  if (_showProductIdx >= 0) showProduct(_showProductIdx);
}

function editBomRow(id, table, curIng, curQty, curUnit, curCost) {
  const row = document.getElementById('bom-row-' + id);
  if (!row) return;
  row.onclick = null;
  const isSemi = table === 'semi';
  const inputStyle = 'width:100%;padding:4px 6px;border:1px solid var(--accent);border-radius:4px;background:var(--surface2);color:var(--text);font-size:13px;box-sizing:border-box';
  row.innerHTML = `
    <td style="padding:4px 6px"><input id="be_ing_${id}" value="${curIng}" style="${inputStyle}"></td>
    <td style="padding:4px 6px"><input id="be_qty_${id}" type="number" step="any" value="${curQty}" style="${inputStyle};text-align:right"></td>
    ${isSemi ? '' : `<td style="padding:4px 6px"><input id="be_unit_${id}" value="${curUnit}" style="${inputStyle};width:40px"></td>`}
    <td style="padding:4px 6px"><input id="be_cost_${id}" type="number" step="any" value="${curCost}" style="${inputStyle};text-align:right"></td>
    <td style="padding:4px 4px;white-space:nowrap">
      <button onclick="event.stopPropagation();saveBomEdit(${id},'${table}')" style="padding:3px 8px;border:none;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;font-weight:600">存</button>
      <button onclick="event.stopPropagation();${isSemi?'showSemi(_showSemiIdx)':'showProduct(_showProductIdx)'}" style="padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text3);cursor:pointer;font-size:12px;margin-left:2px">取消</button>
    </td>`;
  document.getElementById('be_ing_' + id).focus();
}

async function saveBomEdit(id, table) {
  const ing = document.getElementById('be_ing_'+id).value.trim();
  const qty = parseFloat(document.getElementById('be_qty_'+id).value);
  const cost = parseFloat(document.getElementById('be_cost_'+id).value);
  if (!ing) { alert('請填配料名稱'); return; }
  const t = table === 'semi' ? 'cost_semi_bom' : 'cost_bom';
  const data = {ingredient: ing, qty: qty||0, cost: cost||0};
  if (table !== 'semi') data.unit = document.getElementById('be_unit_'+id).value.trim() || 'g';
  const {error} = await db.from(t).update(data).eq('id', id);
  if (error) { alert('儲存失敗: ' + error.message); return; }
  if (table === 'semi') {
    const semiName = SEMIS[_showSemiIdx].name;
    await recalcSemi(semiName);
    await loadData();
    _showSemiIdx = SEMIS.findIndex(s => s.name === semiName);
    showSemi(_showSemiIdx);
  } else {
    const prodName = PRODUCTS[_showProductIdx].name;
    await recalcProduct(prodName);
    await loadData();
    _showProductIdx = PRODUCTS.findIndex(p => p.name === prodName);
    showProduct(_showProductIdx);
  }
}

async function recalcSemi(semiName) {
  const {data: rows} = await db.from('cost_semi_bom').select('cost').eq('semi_name', semiName);
  const totalCost = (rows||[]).reduce((s, r) => s + Number(r.cost), 0);
  const {data: dbSemi} = await db.from('cost_semis').select('yield_g').eq('name', semiName).single();
  const yieldG = dbSemi ? Number(dbSemi.yield_g) : 0;
  const unitCost = yieldG > 0 ? totalCost / yieldG : 0;
  await db.from('cost_semis').update({
    total_cost: Math.round(totalCost * 100) / 100,
    unit_cost: Math.round(unitCost * 1000000) / 1000000
  }).eq('name', semiName);
  await db.from('cost_semi_bom').update({
    total_cost: Math.round(totalCost * 100) / 100
  }).eq('semi_name', semiName);
}

async function recalcProduct(productName) {
  const {data: rows} = await db.from('cost_bom').select('cost').eq('product', productName);
  const totalCost = (rows||[]).reduce((s, r) => s + Number(r.cost), 0);
  const {data: dbProd} = await db.from('cost_products').select('price').eq('name', productName).single();
  const price = dbProd ? Number(dbProd.price) : 0;
  const costPct = price > 0 ? Math.round(totalCost / price * 1000) / 10 : 0;
  await db.from('cost_products').update({
    cost: Math.round(totalCost * 100) / 100,
    cost_pct: costPct
  }).eq('name', productName);
  await db.from('cost_bom').update({
    total_cost: Math.round(totalCost * 100) / 100
  }).eq('product', productName);
}

async function addSemiBomRow(semiName) {
  const ingredient = prompt('配料名稱：');
  if (!ingredient) return;
  const qty = parseFloat(prompt('用量（g）：'));
  if (!qty || isNaN(qty)) return;
  const cost = parseFloat(prompt('成本（元）：'));
  if (!cost || isNaN(cost)) return;
  const {error} = await db.from('cost_semi_bom').insert({semi_name: semiName, ingredient, qty, cost});
  if (error) { alert('新增失敗: ' + error.message); return; }
  await recalcSemi(semiName);
  await loadData();
  _showSemiIdx = SEMIS.findIndex(s => s.name === semiName);
  if (_showSemiIdx >= 0) showSemi(_showSemiIdx);
}

// ── 定價試算 ──────────────────────────────
const PR = {
  product: '', foodCost: '', sellingPrice: '', platform: 'uber', commRate: 33,
  hasPromo: false, promoThreshold: 250, promoDiscount: 20, promoBear: 100,
  hasAd: true, adType: 'percent', adPct: 10, adFixed: 0, adSubsidy: 0, qty: 1
};
const PLATS = { uber: { n: 'UberEats', c: 33 }, panda: { n: 'Foodpanda', c: 31 }, custom: { n: '自訂', c: 33 } };

function prFmt(n) { return '$' + Math.abs(Math.round(n)).toLocaleString(); }

function prCalc() {
  const price = Number(PR.sellingPrice)||0, cost = Number(PR.foodCost)||0;
  const qty = Math.max(1, Number(PR.qty)||1), cr = PR.commRate/100;
  let total = price * qty, disc = 0, mBear = 0;
  if (PR.hasPromo && total >= Number(PR.promoThreshold)) {
    disc = total * (PR.promoDiscount/100);
    mBear = disc * (PR.promoBear/100);
  }
  const afterDisc = total - mBear;
  const comm = afterDisc * cr;
  let ad = 0;
  if (PR.hasAd) ad = PR.adType === 'percent' ? afterDisc * (PR.adPct/100) : (Number(PR.adFixed)||0);
  const sub = Number(PR.adSubsidy)||0;
  const realAd = Math.max(0, ad - sub);
  const deduct = comm + realAd + mBear;
  const net = total - deduct;
  const foodTotal = cost * qty;
  const profit = net - foodTotal;
  const mrgSell = price > 0 ? profit/total*100 : 0;
  return { total, disc, mBear, afterDisc, comm, ad, sub, realAd, deduct, net, foodTotal, profit, mrgSell, price, cost, qty, perNet: net/qty, perProfit: profit/qty };
}

function prSuggest() {
  const cost = Number(PR.foodCost)||0;
  if (cost <= 0) return null;
  const cr = PR.commRate/100, ar = (PR.hasAd && PR.adType==='percent') ? PR.adPct/100 : 0;
  return [20,25,30].map(t => ({ t, p: Math.ceil(cost/(1-cr-ar-t/100)/5)*5 }));
}

function prUpd(k, v) {
  if (typeof v === 'string' && !['adType','platform','product'].includes(k)) {
    if (v === '') { PR[k] = ''; renderPricing(); return; }
    v = k === 'hasPromo' || k === 'hasAd' ? v : parseFloat(v);
  }
  PR[k] = v;
  renderPricing();
}

function prSetPlat(p) {
  PR.platform = p;
  PR.commRate = PLATS[p].c;
  renderPricing();
}

function prPickProduct(idx) {
  PR.product = idx;
  if (idx === '') { PR.foodCost = ''; PR.sellingPrice = ''; }
  else {
    const p = PRODUCTS[Number(idx)];
    PR.foodCost = p.cost;
    PR.sellingPrice = p.price;
  }
  renderPricing();
}
// ─────────────────────────────────────────
</script>
